<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#800020">
  <title>Thanh toán | Nếp Cài</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/images/brand/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="../assets/images/brand/apple-touch-icon.png">
  <link rel="preload" href="../assets/fonts/tex-gyre-pagella-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="is-loading">
  <div id="site-header"></div>

  <main>
    <section class="page-banner">
      <div class="container">
        <p class="breadcrumb"><a href="../home/index.html">Trang chủ</a> / <a href="../cart/index.html">Giỏ hàng</a> / Thanh toán</p>
        <h1>Thanh toán</h1>
      </div>
    </section>

    <section class="section checkout-section">
      <form class="container checkout" id="checkoutForm" novalidate>
        <div class="checkout-main">
          <!-- 1. ĐỊA CHỈ GIAO HÀNG -->
          <fieldset class="block">
            <legend><span class="step">1</span> Địa chỉ giao hàng</legend>

            <label class="option" id="optDefault">
              <input type="radio" name="ship" value="default">
              <span class="dot" aria-hidden="true"></span>
              <span class="option-body">
                <strong>Địa chỉ mặc định</strong>
                <span class="option-desc" id="defaultAddr">Đang tải…</span>
              </span>
            </label>

            <label class="option" id="optOther">
              <input type="radio" name="ship" value="other">
              <span class="dot" aria-hidden="true"></span>
              <span class="option-body">
                <strong>Địa chỉ khác</strong>
                <span class="option-desc">Giao tới một địa chỉ hoặc người nhận khác</span>
              </span>
            </label>

            <div class="other-addr" id="otherAddr" hidden>
              <div class="field-row">
                <div class="field">
                  <label for="shipName">Tên người nhận *</label>
                  <input class="input" id="shipName" autocomplete="name" maxlength="100">
                </div>
                <div class="field">
                  <label for="shipPhone">Số điện thoại *</label>
                  <input class="input" id="shipPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="15">
                </div>
              </div>
              <div class="field">
                <label for="shipAddress">Địa chỉ nhận hàng *</label>
                <textarea class="input" id="shipAddress" rows="2" autocomplete="street-address" maxlength="300" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành phố"></textarea>
              </div>
              <label class="check" id="saveDefaultWrap">
                <input type="checkbox" id="saveDefault">
                <span>Lưu làm địa chỉ mặc định cho lần sau</span>
              </label>
            </div>
          </fieldset>

          <!-- 2. THANH TOÁN -->
          <fieldset class="block">
            <legend><span class="step">2</span> Phương thức thanh toán</legend>
            <label class="option">
              <input type="radio" name="payment" value="cod" checked>
              <span class="dot" aria-hidden="true"></span>
              <span class="option-body">
                <strong>Thanh toán khi nhận hàng (COD)</strong>
                <span class="option-desc">Trả tiền mặt cho nhân viên giao hàng</span>
              </span>
            </label>
            <label class="option is-disabled" aria-disabled="true">
              <input type="radio" name="payment" value="qr" disabled>
              <span class="dot" aria-hidden="true"></span>
              <span class="option-body">
                <strong>Chuyển khoản qua mã QR <span class="soon">Sắp ra mắt</span></strong>
                <span class="option-desc">Quét mã bằng app ngân hàng</span>
              </span>
            </label>
          </fieldset>

          <!-- 3. GHI CHÚ -->
          <fieldset class="block">
            <legend><span class="step">3</span> Ghi chú <small>(không bắt buộc)</small></legend>
            <textarea class="input" id="note" rows="2" maxlength="500" placeholder="Ví dụ: giao giờ hành chính, gọi trước khi giao…"></textarea>
          </fieldset>
        </div>

        <!-- TÓM TẮT -->
        <aside class="summary">
          <div class="summary-head">
            <h2>Đơn hàng</h2>
            <a class="link-line" id="editCart" href="../cart/index.html">Sửa giỏ hàng</a>
          </div>
          <div class="summary-items" id="summaryItems"></div>
          <div class="sum-row"><span>Tạm tính</span><span id="subtotal">0₫</span></div>
          <div class="sum-row"><span>Gói quà</span><span>Miễn phí</span></div>
          <div class="sum-row total"><span>Tổng cộng</span><span id="total">0₫</span></div>
          <button class="btn btn-block" type="submit" id="placeBtn">Đặt hàng</button>
          <p class="form-msg" id="msg" role="alert"></p>
        </aside>
      </form>

      <!-- ĐẶT HÀNG THÀNH CÔNG -->
      <div class="container success" id="successBox" hidden>
        <span class="success-icon">✦</span>
        <h2>Cảm ơn bạn đã đặt hàng!</h2>
        <p>Mã đơn hàng: <strong id="orderId"></strong> · Trạng thái: <strong>Đang xử lý</strong></p>
        <div class="success-card" id="successShip"></div>
        <div class="success-actions">
          <a class="btn" href="../customer/index.html">Xem đơn hàng của tôi</a>
          <a class="btn btn-outline" href="../tram-cai/index.html">Tiếp tục mua sắm</a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="script.js"></script>
</body>
</html>
