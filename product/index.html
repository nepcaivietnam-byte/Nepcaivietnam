<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#800020">
  <title>Sản phẩm | Nếp Cài</title>
  <meta name="description" content="Nếp Cài — Trâm cài mang dấu ấn Việt, thiết kế và chế tác thủ công từ đất sét.">
  <link rel="icon" href="../assets/images/brand/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="../assets/images/brand/apple-touch-icon.png">
  <link rel="preload" href="../assets/fonts/tex-gyre-pagella-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <div class="container"><nav class="crumbs" id="crumbs" aria-label="Đường dẫn"></nav></div>
    <div class="container pd" id="pd">
      <div class="pd-gallery"><div class="skeleton" style="aspect-ratio:1"></div></div>
      <div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div></div>
    </div>
    <section class="pd-tabs-wrap" id="tabsWrap" hidden>
      <div class="container">
        <div class="pd-tabs" role="tablist" id="tabs">
          <button role="tab" data-tab="desc" class="active">Mô tả sản phẩm</button>
          <button role="tab" data-tab="material">Chất liệu &amp; Kích thước</button>
          <button role="tab" data-tab="usage">Hướng dẫn sử dụng</button>
          <button role="tab" data-tab="care">Bảo quản</button>
          <span class="tab-ink" id="tabInk"></span>
        </div>
        <div class="pd-panel prose" id="tabPanel" role="tabpanel"></div>
      </div>
    </section>
    <section class="section related" id="related" hidden>
      <div class="container">
        <div class="title-lotus" data-lotus><h2>Sản phẩm liên quan</h2></div>
        <div class="rail-wrap">
          <button class="rail-btn prev" type="button" id="railPrev" aria-label="Trước"></button>
          <div class="rail" id="relatedRail"></div>
          <button class="rail-btn next" type="button" id="railNext" aria-label="Sau"></button>
        </div>
      </div>
    </section>
    <section class="cta-band" id="colCta" hidden></section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="script.js"></script>
</body>
</html>
