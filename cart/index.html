<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#800020">
  <title>Giỏ hàng | Nếp Cài</title>
  <link rel="icon" href="../assets/images/brand/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="../assets/images/brand/apple-touch-icon.png">
  <link rel="preload" href="../assets/fonts/tex-gyre-pagella-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="page-banner">
      <div class="container">
        <p class="breadcrumb"><a href="../home/index.html">Trang chủ</a> / Giỏ hàng</p>
        <h1>Giỏ hàng</h1>
      </div>
    </section>

    <section class="section">
      <div class="container cart-layout" id="cartLayout">
        <div class="cart-items" id="cartItems"></div>
        <aside class="cart-summary" id="cartSummary" hidden>
          <h2>Tóm tắt đơn hàng</h2>
          <div class="sum-row"><span>Tạm tính</span><span id="subtotal">0₫</span></div>
          <div class="sum-row"><span>Gói quà</span><span>Miễn phí</span></div>
          <div class="sum-row total"><span>Tổng cộng</span><span id="total">0₫</span></div>
          <a class="btn btn-block" id="checkoutBtn" href="../checkout/index.html">Tiến hành thanh toán</a>
          <p class="form-msg" id="checkoutMsg"></p>
          <a class="link-line continue" href="../tram-cai/index.html">Tiếp tục mua sắm</a>
        </aside>
      </div>

    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="script.js"></script>
</body>
</html>
