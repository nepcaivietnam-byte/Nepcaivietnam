<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#800020">
  <title>Trâm cài | Nếp Cài</title>
  <meta name="description" content="Trâm cài, vòng trâm, cây trâm đất sét nặn tay — gửi gắm nét duyên Việt qua từng thiết kế nhỏ xinh.">
  <link rel="icon" href="../assets/images/brand/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="../assets/images/brand/apple-touch-icon.png">
  <link rel="preload" href="../assets/fonts/tex-gyre-pagella-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-hero" style="background-image:url(../assets/images/hero/tram-cai.jpg)">
      <div class="container">
        <div class="page-hero-text">
          <span class="ornament" data-lotus><i></i><i></i></span>
          <h1>Trâm cài tóc</h1>
          <p>Gửi gắm nét duyên Việt<br>qua từng thiết kế nhỏ xinh.</p>
          <a class="btn" href="#catalog">Khám phá ngay</a>
        </div>
      </div>
    </section>

    <section class="section catalog" id="catalog">
      <div class="container">
        <div class="filter-tabs" id="catTabs" role="tablist" aria-label="Lọc theo loại">
          <button type="button" data-cat="all" class="active">Tất cả sản phẩm</button>
          <button type="button" data-cat="tram-cai">Trâm cài</button>
          <button type="button" data-cat="vong-tram">Vòng trâm</button>
          <button type="button" data-cat="cay-tram">Cây trâm</button>
          <button type="button" data-cat="new">Sản phẩm mới</button>
          <button type="button" data-cat="featured">Sản phẩm nổi bật</button>
        </div>
        <div class="toolbar">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <input type="search" id="searchInput" placeholder="Tìm trâm cài…" autocomplete="off" enterkeyhint="search">
          </div>
          <select class="tb-select" id="colSelect" aria-label="Lọc theo tập phẩm"><option value="">Tất cả tập phẩm</option></select>
          <span class="result-count" id="resultCount"></span>
          <select class="tb-select" id="sortSelect" aria-label="Sắp xếp">
            <option value="new">Mới nhất</option>
            <option value="price-asc">Giá tăng dần</option>
            <option value="price-desc">Giá giảm dần</option>
            <option value="name">Tên A – Z</option>
          </select>
        </div>
        <div class="product-grid" id="productGrid"></div>
        <div class="pager" id="pager"></div>
      </div>
    </section>

    <section class="cta-band">
      <div class="container">
        <div class="cta-box reveal">
          <span class="ornament" data-lotus><i></i><i></i></span>
          <p class="q">“Cài nét Xưa,<br>giữ một nếp Việt.”</p>
          <p>Mỗi chiếc trâm cài từ Nếp là một mảnh ghép nhỏ của văn hóa Việt, được thổi hồn qua bàn tay thủ công và trái tim yêu cái đẹp.</p>
          <a class="btn" href="../ve-nep/index.html">Về Nếp</a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="script.js"></script>
</body>
</html>
