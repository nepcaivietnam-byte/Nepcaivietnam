<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#800020">
  <title>Đăng ký | Nếp Cài</title>
  <link rel="icon" href="../assets/images/brand/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="../assets/images/brand/apple-touch-icon.png">
  <link rel="preload" href="../assets/fonts/tex-gyre-pagella-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth">
    <aside class="auth-visual">
      <img src="../assets/images/auth-mai.jpg" alt="">
      <div class="auth-quote">
        <a class="logo" href="../home/index.html" id="brandLogo"></a>
        <p>“Mỗi chiếc trâm<br>là một nắm đất có hồn.”</p>
      </div>
    </aside>

    <main class="auth-panel">
      <a class="back-link" href="../home/index.html">← Về trang chủ</a>
      <div class="auth-box">
        <span class="eyebrow">Tạo tài khoản</span>
        <h1>Đăng ký</h1>
        <form id="registerForm" novalidate>
          <div class="field">
            <label for="fullName">Họ và tên *</label>
            <input class="input" id="fullName" autocomplete="name" required placeholder="Nguyễn Thị Hoa">
          </div>
          <div class="field">
            <label for="email">Gmail *</label>
            <input class="input" id="email" type="email" autocomplete="email" required placeholder="ban@gmail.com">
          </div>
          <div class="field-row">
            <div class="field">
              <label for="password">Mật khẩu *</label>
              <input class="input" id="password" type="password" autocomplete="new-password" required minlength="6">
            </div>
            <div class="field">
              <label for="password2">Nhập lại *</label>
              <input class="input" id="password2" type="password" autocomplete="new-password" required>
            </div>
          </div>
          <p class="hint">Mật khẩu tối thiểu 6 ký tự.</p>
          <div class="field">
            <label for="phone">Số điện thoại</label>
            <input class="input" id="phone" type="tel" autocomplete="tel" placeholder="09xx xxx xxx">
          </div>
          <div class="field">
            <label for="address">Địa chỉ giao hàng</label>
            <textarea class="input" id="address" rows="2" autocomplete="street-address" placeholder="Số nhà, đường, phường, quận, tỉnh/thành"></textarea>
          </div>
          <button class="btn btn-block" type="submit" id="submitBtn">Tạo tài khoản</button>
          <p class="form-msg" id="msg"></p>
        </form>
        <p class="switch">Đã có tài khoản? <a href="../login/index.html" id="loginLink">Đăng nhập</a></p>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="script.js"></script>
</body>
</html>
