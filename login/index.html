<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#800020">
  <title>Đăng nhập | Nếp Cài</title>
  <link rel="icon" href="../assets/images/brand/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="../assets/images/brand/apple-touch-icon.png">
  <link rel="preload" href="../assets/fonts/tex-gyre-pagella-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth">
    <aside class="auth-visual">
      <img src="../assets/images/auth-sen.jpg" alt="">
      <div class="auth-quote">
        <a class="logo" href="../home/index.html" id="brandLogo"></a>
        <p>“Cài một nét Xưa,<br>giữ một nếp Việt.”</p>
      </div>
    </aside>

    <main class="auth-panel">
      <a class="back-link" href="../home/index.html">← Về trang chủ</a>
      <div class="auth-box">
        <span class="eyebrow">Chào mừng trở lại</span>
        <h1>Đăng nhập</h1>
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Gmail</label>
            <input class="input" id="email" type="email" autocomplete="email" required placeholder="ban@gmail.com">
          </div>
          <div class="field">
            <label for="password">Mật khẩu</label>
            <div class="pw-wrap">
              <input class="input" id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
              <button type="button" class="pw-toggle" id="pwToggle">Hiện</button>
            </div>
          </div>
          <button class="btn btn-block" type="submit" id="submitBtn">Đăng nhập</button>
          <p class="form-msg" id="msg"></p>
        </form>
        <p class="switch">Chưa có tài khoản? <a href="../register/index.html" id="registerLink">Đăng ký ngay</a></p>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="script.js"></script>
</body>
</html>
