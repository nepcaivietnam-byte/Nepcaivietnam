<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#800020">
  <title>Tài khoản của tôi | Nếp Cài</title>
  <link rel="icon" href="../assets/images/brand/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="../assets/images/brand/apple-touch-icon.png">
  <link rel="preload" href="../assets/fonts/tex-gyre-pagella-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="is-loading">
  <div id="site-header"></div>

  <main>
    <!-- Lời chào -->
    <section class="welcome">
      <div class="container welcome-inner">
        <div class="welcome-avatar" id="bigAvatar">·</div>
        <div>
          <span class="eyebrow">Trang khách hàng</span>
          <h1>Xin chào, <em id="helloName">bạn</em></h1>
          <p id="memberSince"></p>
        </div>
        <a class="btn btn-light" href="../tram-cai/index.html">Mua sắm ngay</a>
      </div>
    </section>

    <!-- Tabs -->
    <section class="section account-section">
      <div class="container">
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="orders" role="tab">Đơn hàng của tôi</button>
          <button class="tab" data-tab="profile" role="tab">Thông tin cá nhân</button>
          <span class="tab-ink" id="tabInk"></span>
        </div>

        <div class="tab-panel active" id="panel-orders">
          <div class="stats" id="stats"></div>
          <div class="orders" id="ordersList"></div>
        </div>

        <div class="tab-panel" id="panel-profile">
          <form class="profile-form" id="profileForm">
            <div class="field">
              <label>Gmail</label>
              <input class="input" id="pfEmail" disabled>
            </div>
            <div class="field">
              <label for="pfName">Họ và tên</label>
              <input class="input" id="pfName" required>
            </div>
            <div class="field">
              <label for="pfPhone">Số điện thoại</label>
              <input class="input" id="pfPhone" type="tel">
            </div>
            <div class="field">
              <label for="pfAddress">Địa chỉ giao hàng</label>
              <textarea class="input" id="pfAddress" rows="3"></textarea>
            </div>
            <button class="btn" type="submit" id="pfSave">Lưu thay đổi</button>
            <p class="form-msg" id="pfMsg"></p>
          </form>
        </div>
      </div>
    </section>

    <!-- Gợi ý -->
    <section class="section suggest">
      <div class="container">
        <div class="section-head reveal">
          <div><span class="eyebrow">Dành cho bạn</span><h2>Có thể bạn sẽ thích</h2></div>
          <a class="link-line" href="../tram-cai/index.html">Xem tất cả</a>
        </div>
        <div class="product-grid" id="suggestGrid"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="script.js"></script>
</body>
</html>
